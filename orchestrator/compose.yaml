services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data

  agent-zero-bootstrap:
    image: busybox:1.37
    restart: "no"
    profiles: ["agent-zero"]
    environment:
      AGENT_ZERO_RUNTIME_ID: ${AGENT_ZERO_RUNTIME_ID:-}
    volumes:
      - agent-zero-data:/a0/usr
      - ./agent-zero/model-presets.yaml:/bootstrap/model-presets.yaml:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        test -n "$AGENT_ZERO_RUNTIME_ID"
        touch /a0/usr/.env
        if grep -q '^A0_PERSISTENT_RUNTIME_ID=' /a0/usr/.env; then
          sed -i "s|^A0_PERSISTENT_RUNTIME_ID=.*$|A0_PERSISTENT_RUNTIME_ID=$AGENT_ZERO_RUNTIME_ID|" /a0/usr/.env
        else
          printf '\nA0_PERSISTENT_RUNTIME_ID=%s\n' "$AGENT_ZERO_RUNTIME_ID" >> /a0/usr/.env
        fi
        if [ ! -f /a0/usr/plugins/_model_config/presets.yaml ]; then
          mkdir -p /a0/usr/plugins/_model_config
          cp /bootstrap/model-presets.yaml /a0/usr/plugins/_model_config/presets.yaml
        fi

  agent-zero:
    image: agent0ai/agent-zero:v2.11
    restart: unless-stopped
    profiles: ["agent-zero"]
    environment:
      A0_PERSISTENT_RUNTIME_ID: ${AGENT_ZERO_RUNTIME_ID:-}
      A0_SET_AGENT_PROFILE: tiny-local
    ports:
      - "127.0.0.1:5080:80"
    volumes:
      - agent-zero-data:/a0/usr
    depends_on:
      agent-zero-bootstrap:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.33.2
    restart: unless-stopped
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-model-bootstrap:
    image: ollama/ollama:0.33.2
    restart: "no"
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull qwen3:4b

  orchestrator:
    build: .
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      JARVIS_REQUIRE_AUTH: ${JARVIS_REQUIRE_AUTH:-1}
      JARVIS_API_TOKEN: ${JARVIS_API_TOKEN:-}
      JARVIS_API_KEYS_JSON: ${JARVIS_API_KEYS_JSON:-}
      JARVIS_RUNTIME: ${JARVIS_RUNTIME:-echo}
      JARVIS_SESSION_LOCK_TIMEOUT_SECONDS: ${JARVIS_SESSION_LOCK_TIMEOUT_SECONDS:-}
      AGENT_ZERO_URL: ${AGENT_ZERO_URL:-http://agent-zero}
      AGENT_ZERO_API_KEY: ${AGENT_ZERO_API_KEY:-}
      AGENT_ZERO_TIMEOUT_SECONDS: ${AGENT_ZERO_TIMEOUT_SECONDS:-300}
      AGENT_ZERO_LIFETIME_HOURS: ${AGENT_ZERO_LIFETIME_HOURS:-24}
      AGENT_ZERO_PROJECT: ${AGENT_ZERO_PROJECT:-}
    ports:
      - "${JARVIS_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      - valkey
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  valkey-data:
  agent-zero-data:
  ollama-data:
