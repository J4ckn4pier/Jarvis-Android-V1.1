plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.mobile'
    compileSdk 36

    defaultConfig {
        // Preserve the original My Jarvis application identity for the donor transplant.
        applicationId 'com.itsmylab.jarvis'
        minSdk 29
        targetSdk 36
        versionCode 2101
        versionName '2.0.1-brain-transplant-v1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
