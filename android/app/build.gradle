plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.itsmylab.jarvis'
        minSdk 29
        targetSdk 36
        versionCode 2102
        versionName '2.0.1-prefrontal-transplant-v1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; shrinkResources false }
    }
}

dependencies {
    implementation project(':brain-core')
}
