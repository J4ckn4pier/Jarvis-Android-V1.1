plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jarvis.mobile'
        minSdk 29
        targetSdk 36
        versionCode 2102
        versionName '1.1.0-brain-first'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; shrinkResources false }
    }
}

dependencies {
    implementation project(':brain-core')
}
