name: Settings Voice Runtime Truth

on:
  pull_request:
    branches:
      - feature/product-local-cortex
    paths:
      - 'android/settings_voice_runtime_truth_test.py'
      - 'android/app/src/main/java/com/jarvis/mobile/SettingsActivity.java'
      - 'android/app/src/main/java/com/jarvis/mobile/assistant/JarvisVoiceSession.java'
      - '.github/workflows/settings-voice-runtime-truth.yml'

permissions:
  contents: read

jobs:
  voice-runtime-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify visible voice setting matches production runtime
        working-directory: android
        run: python3 settings_voice_runtime_truth_test.py
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Compile Settings production sources
        working-directory: android
        run: ./gradlew :app:compileDebugJavaWithJavac
