name: Settings Widget Runtime Truth

on:
  pull_request:
    branches:
      - feature/product-local-cortex
    paths:
      - '.github/scripts/widget-lock-save-cancel-contract.sh'
      - 'android/app/src/main/java/com/jarvis/mobile/SettingsActivity.java'
      - '.github/workflows/settings-widget-runtime-truth.yml'

permissions:
  contents: read

jobs:
  widget-runtime-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify Widgets & Lock Screen honors SAVE/CANCEL
        run: sh .github/scripts/widget-lock-save-cancel-contract.sh
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Settings production sources
        working-directory: android
        run: gradle :app:compileDebugJavaWithJavac --stacktrace
