name: Orchestrator Tests

on:
  push:
    branches: [feature/jarvis-orchestrator]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install orchestrator
        run: pip install -e '.[test]'
      - name: Run tests
        run: pytest -q

  prototype-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Boot standalone prototype
        run: docker compose up -d --build valkey orchestrator
      - name: Exercise command and durable event history
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          health = None
          for _ in range(60):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as response:
                      health = json.load(response)
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          if health is None:
              raise SystemExit("orchestrator did not become healthy")
          assert health["status"] == "ok", health
          assert health["state_backend"] == "valkey", health

          request = urllib.request.Request(
              base + "/v1/command",
              data=json.dumps({"text": "prototype smoke test", "session_id": "ci-prototype"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              command = json.load(response)
          assert command["session_id"] == "ci-prototype", command
          assert command["response"] == "JARVIS received: prototype smoke test", command

          with urllib.request.urlopen(base + "/v1/sessions/ci-prototype/events", timeout=10) as response:
              history = json.load(response)
          assert history["session_id"] == "ci-prototype", history
          assert [event["sequence"] for event in history["events"]] == [1, 2, 3, 4], history
          assert history["events"][-1]["agent_ops_status"] == "Complete", history
          print(json.dumps({"health": health, "command": command, "events": len(history["events"])}, indent=2))
          PY
      - name: Show prototype logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop prototype
        if: always()
        run: docker compose down -v
