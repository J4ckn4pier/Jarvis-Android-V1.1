name: Orchestrator Tests

on:
  push:
    branches: [feature/jarvis-orchestrator]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install orchestrator
        run: pip install -e '.[test]'
      - name: Run tests
        run: pytest -q

  prototype-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Boot standalone prototype
        run: docker compose up -d --build valkey orchestrator
      - name: Wait for healthy orchestrator
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health -o /tmp/health.json; then
              cat /tmp/health.json
              python3 - <<'PY'
          import json
          with open('/tmp/health.json') as handle:
              health = json.load(handle)
          assert health['status'] == 'ok', health
          assert health['state_backend'] == 'valkey', health
          PY
              exit 0
            fi
            sleep 1
          done
          echo 'orchestrator did not become healthy'
          exit 1
      - name: Send prototype command
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/v1/command \
            -H 'Content-Type: application/json' \
            -d '{"text":"prototype smoke test","session_id":"ci-prototype"}' \
            -o /tmp/command.json
          cat /tmp/command.json
          python3 - <<'PY'
          import json
          with open('/tmp/command.json') as handle:
              command = json.load(handle)
          assert command['session_id'] == 'ci-prototype', command
          assert command['response'] == 'JARVIS received: prototype smoke test', command
          PY
      - name: Recover durable prototype history
        run: |
          curl -fsS http://127.0.0.1:8000/v1/sessions/ci-prototype/events -o /tmp/history.json
          cat /tmp/history.json
          python3 - <<'PY'
          import json
          with open('/tmp/history.json') as handle:
              history = json.load(handle)
          assert history['session_id'] == 'ci-prototype', history
          assert [event['sequence'] for event in history['events']] == [1, 2, 3, 4], history
          assert history['events'][-1]['agent_ops_status'] == 'Complete', history
          PY
      - name: Show prototype logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop prototype
        if: always()
        run: docker compose down -v
