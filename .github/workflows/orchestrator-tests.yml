name: Orchestrator Tests

on:
  push:
    branches: [feature/jarvis-orchestrator]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install orchestrator
        run: pip install -e '.[test]'
      - name: Run tests
        run: pytest -q

  prototype-smoke:
    runs-on: ubuntu-latest
    env:
      JARVIS_API_KEYS_JSON: '{"ci-user":"ci-token","other-user":"other-token"}'
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Verify packaged security defaults
        run: |
          docker compose --profile agent-zero --profile local-ai config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/compose.json') as handle:
              config = json.load(handle)
          environment = config['services']['orchestrator']['environment']
          assert environment['JARVIS_API_KEYS_JSON'] == '{"ci-user":"ci-token","other-user":"other-token"}', environment
          for service_name in ('orchestrator', 'agent-zero', 'ollama'):
              ports = config['services'][service_name]['ports']
              assert ports, (service_name, ports)
              assert all(port.get('host_ip') == '127.0.0.1' for port in ports), (service_name, ports)
          PY
      - name: Boot standalone prototype
        run: docker compose up -d --build valkey orchestrator
      - name: Verify orchestrator runs without root privileges
        run: |
          uid="$(docker compose exec -T orchestrator id -u)"
          echo "orchestrator uid=$uid"
          test "$uid" != "0"
      - name: Wait for ready orchestrator
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready -o /tmp/ready.json; then
              cat /tmp/ready.json
              python3 - <<'PY'
          import json
          with open('/tmp/ready.json') as handle:
              ready = json.load(handle)
          assert ready['status'] == 'ready', ready
          assert ready['state_backend'] == 'valkey', ready
          assert ready['auth_mode'] == 'multi-principal', ready
          PY
              exit 0
            fi
            sleep 1
          done
          echo 'orchestrator did not become ready'
          exit 1
      - name: Send first user's prototype command
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/v1/command \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"text":"prototype smoke test","session_id":"primary","request_id":"ci-retry-1"}' \
            -o /tmp/command.json
          cat /tmp/command.json
          python3 - <<'PY'
          import json
          with open('/tmp/command.json') as handle:
              command = json.load(handle)
          assert command['session_id'] == 'primary', command
          assert command['request_id'] == 'ci-retry-1', command
          assert command['response'] == 'JARVIS received: prototype smoke test', command
          PY
      - name: Prove mobile retry is deduplicated through Valkey
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/v1/command \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"text":"prototype smoke test","session_id":"primary","request_id":"ci-retry-1"}' \
            -o /tmp/retry.json
          curl -fsS http://127.0.0.1:8000/v1/sessions/primary/events \
            -H 'Authorization: Bearer ci-token' \
            -o /tmp/retry-history.json
          python3 - <<'PY'
          import json
          with open('/tmp/command.json') as handle:
              first = json.load(handle)
          with open('/tmp/retry.json') as handle:
              retry = json.load(handle)
          with open('/tmp/retry-history.json') as handle:
              history = json.load(handle)
          assert retry == first, (first, retry)
          assert len(history['events']) == 4, history
          assert {event['task_id'] for event in history['events']} == {first['task_id']}, history
          PY
          status="$(curl -sS -o /tmp/conflict.json -w '%{http_code}' -X POST http://127.0.0.1:8000/v1/command \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"text":"different command","session_id":"primary","request_id":"ci-retry-1"}')"
          cat /tmp/conflict.json
          test "$status" = "409"
      - name: Prove same public session is isolated between users
        run: |
          curl -fsS http://127.0.0.1:8000/v1/sessions/primary/events \
            -H 'Authorization: Bearer ci-token' \
            -o /tmp/first-history.json
          curl -fsS http://127.0.0.1:8000/v1/sessions/primary/events \
            -H 'Authorization: Bearer other-token' \
            -o /tmp/other-history.json
          cat /tmp/first-history.json
          cat /tmp/other-history.json
          python3 - <<'PY'
          import json
          with open('/tmp/first-history.json') as handle:
              first = json.load(handle)
          with open('/tmp/other-history.json') as handle:
              other = json.load(handle)
          assert first['session_id'] == 'primary', first
          assert [event['sequence'] for event in first['events']] == [1, 2, 3, 4], first
          assert first['events'][-1]['agent_ops_status'] == 'Complete', first
          assert other == {'session_id': 'primary', 'events': []}, other
          PY
      - name: Send second user's same-named session
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/v1/command \
            -H 'Authorization: Bearer other-token' \
            -H 'Content-Type: application/json' \
            -d '{"text":"second isolated user","session_id":"primary"}' \
            -o /tmp/other-command.json
          curl -fsS http://127.0.0.1:8000/v1/sessions/primary/events \
            -H 'Authorization: Bearer other-token' \
            -o /tmp/other-history-after.json
          python3 - <<'PY'
          import json
          with open('/tmp/other-command.json') as handle:
              command = json.load(handle)
          with open('/tmp/other-history-after.json') as handle:
              history = json.load(handle)
          assert command['session_id'] == 'primary', command
          assert command['response'] == 'JARVIS received: second isolated user', command
          assert [event['sequence'] for event in history['events']] == [1, 2, 3, 4], history
          PY
      - name: Show prototype logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop prototype
        if: always()
        run: docker compose down -v

  agent-zero-adapter-smoke:
    runs-on: ubuntu-latest
    env:
      JARVIS_API_TOKEN: ci-token
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Validate Agent Zero adapter harness
        run: docker compose -f compose.yaml -f compose.ci-agent-zero.yaml config --quiet
      - name: Boot Agent Zero adapter path
        run: docker compose -f compose.yaml -f compose.ci-agent-zero.yaml up -d --build valkey fake-agent-zero orchestrator
      - name: Wait for worker-aware readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready -o /tmp/ready-agent.json; then
              cat /tmp/ready-agent.json
              python3 - <<'PY'
          import json
          with open('/tmp/ready-agent.json') as handle:
              ready = json.load(handle)
          assert ready['status'] == 'ready', ready
          assert ready['runtime'] == 'agent-zero', ready
          PY
              exit 0
            fi
            sleep 1
          done
          echo 'Agent Zero adapter path did not become ready'
          exit 1
      - name: Prove Agent Zero dispatch and persisted context reuse
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/v1/command \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"text":"first worker turn","session_id":"primary"}' \
            -o /tmp/agent-first.json
          curl -fsS -X POST http://127.0.0.1:8000/v1/command \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"text":"second worker turn","session_id":"primary"}' \
            -o /tmp/agent-second.json
          cat /tmp/agent-first.json
          cat /tmp/agent-second.json
          python3 - <<'PY'
          import json
          with open('/tmp/agent-first.json') as handle:
              first = json.load(handle)
          with open('/tmp/agent-second.json') as handle:
              second = json.load(handle)
          assert first['response'] == 'Agent Zero stub new: first worker turn', first
          assert second['response'] == 'Agent Zero stub continued: second worker turn', second
          assert first['session_id'] == second['session_id'] == 'primary'
          PY
      - name: Show adapter logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci-agent-zero.yaml logs --no-color
      - name: Stop adapter harness
        if: always()
        run: docker compose -f compose.yaml -f compose.ci-agent-zero.yaml down -v
