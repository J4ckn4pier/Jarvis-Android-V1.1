name: Orchestrator Tests

on:
  push:
    branches: [feature/jarvis-orchestrator]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install orchestrator
        run: pip install -e '.[test]'
      - name: Run tests
        run: pytest -q
