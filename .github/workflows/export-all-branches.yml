name: Export complete JARVIS repository

on:
  push:
    branches: [feature/claude-ui-delivery-refresh-2026-09-01]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch every branch and tag
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          while IFS= read -r ref; do
            name="${ref#refs/remotes/origin/}"
            [ "$name" = "HEAD" ] && continue
            git update-ref "refs/heads/$name" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

      - name: Build complete portable handoff
        run: |
          mkdir -p handoff
          git for-each-ref --sort=refname --format='%(refname:short)\t%(objectname)' refs/heads > handoff/BRANCHES.tsv
          git for-each-ref --sort=refname --format='%(refname:short)\t%(objectname)' refs/tags > handoff/TAGS.tsv
          git log --all --date=iso-strict --pretty=format:'%H%x09%P%x09%ad%x09%an%x09%s' > handoff/ALL-COMMITS.tsv
          git bundle create handoff/JARVIS-ALL-BRANCHES.bundle --all
          git bundle verify handoff/JARVIS-ALL-BRANCHES.bundle | tee handoff/BUNDLE-VERIFY.txt
          git archive --format=zip -o handoff/CURRENT-HANDOFF-BRANCH-SNAPSHOT.zip HEAD
          cat > handoff/README-CLAUDE-HANDOFF.txt <<'EOF'
          COMPLETE JARVIS GITHUB HANDOFF

          This package contains the complete Git history and every branch/tag fetched from GitHub at export time.

          Recommended restore for Claude Code:
            git clone JARVIS-ALL-BRANCHES.bundle Jarvis-Android-V1.1
            cd Jarvis-Android-V1.1
            git branch -a

          If you want the current handoff branch checked out after cloning:
            git checkout feature/claude-ui-delivery-refresh-2026-09-01

          Files:
            JARVIS-ALL-BRANCHES.bundle        Complete portable Git repository history and refs
            BRANCHES.tsv                      Every branch name and exact SHA
            TAGS.tsv                          Every tag name and exact SHA
            ALL-COMMITS.tsv                   Commit inventory across all refs
            BUNDLE-VERIFY.txt                 Git verification output
            CURRENT-HANDOFF-BRANCH-SNAPSHOT.zip  Plain source snapshot of export branch

          Do not treat prior CI labels as proof of physical Samsung behavior. The latest user acceptance found:
            - shipped UI did not match the intended Claude UI artifact
            - Samsung voice/listening still produced error 11
            - normal multi-turn conversation did not reliably reach a real reasoning cortex
          EOF
          (cd handoff && sha256sum * > SHA256SUMS.txt)

      - name: Upload complete repository handoff
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-COMPLETE-GITHUB-HANDOFF
          path: handoff/
          if-no-files-found: error
          retention-days: 30
