name: Build JARVIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build direct Android project
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signed donor-transplant payload
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 500000
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.itsmylab.jarvis'"
          unzip -l "$APK" | grep -q "jarvis_normal"
          unzip -l "$APK" | grep -q "jarvis_active"
          unzip -l "$APK" | grep -q "background_mk2_active"
          unzip -l "$APK" | grep -q "background_mk3_active"
          unzip -l "$APK" | grep -q "button_normal"
          unzip -l "$APK" | grep -q "ready_operational"
          unzip -l "$APK" | grep -q "menu_dots"
          test "$(unzip -Z1 "$APK" | grep -c '/background_mk3.jpg$')" -eq 1
          ! unzip -Z1 "$APK" | grep -Eiq 'assets/dex|pocketsphinx|adcolony|tapjoy|vungle|flurry|revmob|startapp'
          sha256sum "$APK" > android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and test inside Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh .github/scripts/emulator-smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-V1.1-donor-transplant
          path: android/app/build/outputs/apk/debug/*
          if-no-files-found: error
          retention-days: 30
        if: always()
