name: Build and Test JARVIS Prefrontal APK

on:
  push:
    branches: [main, brain-first-v1, feature/product-local-cortex]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JARVIS_SKIP_KNOWN_BLOCKERS: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run shared brain regression suite for APK smoke
        run: bash brain-core/run-tests.sh
      - name: Verify APK remote-goal client contract
        run: sh .github/scripts/remote-goal-client-contract.sh
      - name: Verify remote connection developer settings contract
        run: sh .github/scripts/remote-goal-developer-settings-contract.sh
      - name: Verify remote project continuity contract
        run: sh .github/scripts/remote-goal-continuity-contract.sh
      - name: Verify remote progress UI continuity contract
        run: sh .github/scripts/remote-goal-ui-continuity-contract.sh
      - name: Verify remote approval discovery contract
        run: sh .github/scripts/remote-goal-approval-contract.sh
      - name: Verify remote result is consumed after delivery
        run: sh .github/scripts/remote-goal-result-consumption-contract.sh
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and lint direct Android project with shared brain
        working-directory: android
        run: gradle --rerun-tasks :brain-core:test :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify signed JARVIS payload
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "package: name='com.jarvis.mobile' versionCode='2102' versionName='1.1.0-brain-first'"
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          unzip -Z1 "$APK" | grep -q '^classes.dex$'
          unzip -Z1 "$APK" | grep -q '^assets/jarvis_provenance/origin.idx$'
          unzip -p "$APK" assets/jarvis_provenance/origin.idx > android/app/build/outputs/apk/debug/release-integrity.txt
          grep -q '^format=jarvis-release-integrity-v1$' android/app/build/outputs/apk/debug/release-integrity.txt
          grep -q '^origin=SjRja040cGllcg==$' android/app/build/outputs/apk/debug/release-integrity.txt
          grep -Eq '^files=[1-9][0-9]*$' android/app/build/outputs/apk/debug/release-integrity.txt
          grep -Eq '^root=[0-9a-f]{64}$' android/app/build/outputs/apk/debug/release-integrity.txt
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          aapt dump resources "$APK" > android/app/build/outputs/apk/debug/compiled-resources.txt
          grep -q 'ic_launcher_background' android/app/build/outputs/apk/debug/compiled-resources.txt
          grep -q 'ic_launcher_foreground' android/app/build/outputs/apk/debug/compiled-resources.txt
          grep -q 'ic_stat_jarvis' android/app/build/outputs/apk/debug/compiled-resources.txt
          echo 'DONOR_CONTAMINATION_CHECK'
          ! grep -Eiq 'background_mk2|background_mk3|jarvis_normal|jarvis_active|ic_reactor|icon_jarvis_notes|menu_dots|legacy_network_icon' android/app/build/outputs/apk/debug/compiled-resources.txt
          ! unzip -Z1 "$APK" | grep -Eiq '^res/raw/.*\.mp3$|assets/dex|pocketsphinx|adcolony|tapjoy|vungle|flurry|revmob|startapp'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Align legacy help smoke with truthful product copy
        run: sed -i "s/JARVIS COMMANDS/WORKING EXAMPLES/" .github/scripts/emulator-smoke.sh
      - name: Install, launch, and run release-critical Android 16 smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh .github/scripts/emulator-smoke.sh && sh .github/scripts/overlay-decision-smoke.sh && sh .github/scripts/diagnostics-smoke.sh && sh .github/scripts/local-cortex-smoke.sh && sh .github/scripts/cortex-settings-smoke.sh && sh .github/scripts/remote-goal-integration-emulator-smoke.sh
      - name: Preserve APK sprint emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-sprint-emulator-evidence
          path: |
            android/app/build/outputs/apk/debug/jarvis-*.png
            android/app/build/outputs/apk/debug/jarvis-*.xml
            android/app/build/outputs/apk/debug/emulator-*.txt
            android/app/build/outputs/apk/debug/remote-integration-*.txt
            android/app/build/outputs/apk/debug/remote-integration-*.xml
            android/app/build/outputs/apk/debug/local-cortex-*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Android failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-failure-evidence
          path: android/app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 7
      - name: Stage single verified APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/JARVIS-Android-V1.1.apk
          sha256sum release/JARVIS-Android-V1.1.apk | tee release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-V1.1
          path: |
            release/JARVIS-Android-V1.1.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
