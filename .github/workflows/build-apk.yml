name: Build and Test JARVIS Prefrontal APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test provider-neutral executive language contract
        run: |
          mkdir -p build/core-test
          javac -d build/core-test \
            android/app/src/main/java/com/jarvis/mobile/brain/core/IntentPlan.java \
            android/app/src/main/java/com/jarvis/mobile/brain/core/CommandNormalizer.java \
            android/app/src/main/java/com/jarvis/mobile/brain/core/LocalIntentEngine.java \
            android/app/src/main/java/com/jarvis/mobile/brain/core/BrainResult.java \
            android/app/src/test/java/com/jarvis/mobile/brain/core/LocalIntentEngineContractTest.java
          java -cp build/core-test com.jarvis.mobile.brain.core.LocalIntentEngineContractTest
          test "$(find android/app/src/main/res/raw -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 100

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile and lint direct Android project
        working-directory: android
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify signed donor-transplant payload
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 500000
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "package: name='com.itsmylab.jarvis' versionCode='2102' versionName='2.0.1-prefrontal-transplant-v1.2'"
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          unzip -Z1 "$APK" | grep -q '^classes.dex$'
          unzip -l "$APK" | grep -q 'jarvis_normal'
          unzip -l "$APK" | grep -q 'jarvis_active'
          unzip -l "$APK" | grep -q 'background_mk2_active'
          unzip -l "$APK" | grep -q 'background_mk3_active'
          unzip -l "$APK" | grep -q 'button_normal'
          unzip -l "$APK" | grep -q 'ready_operational'
          unzip -l "$APK" | grep -q 'hello_sir'
          unzip -l "$APK" | grep -q 'didnt_understand'
          unzip -l "$APK" | grep -q 'what_can_i_do'
          unzip -l "$APK" | grep -q 'menu_dots'
          test "$(unzip -Z1 "$APK" | grep -c '^res/raw/.*\.mp3$')" -eq 100
          test "$(unzip -Z1 "$APK" | grep -c '/background_mk3.jpg$')" -eq 1
          ! unzip -Z1 "$APK" | grep -Eiq 'assets/dex|pocketsphinx|adcolony|tapjoy|vungle|flurry|revmob|startapp'

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and test inside Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh .github/scripts/emulator-smoke.sh

      - name: Stage single verified APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/JARVIS-Android-V1.1-Donor-Beta.apk
          sha256sum release/JARVIS-Android-V1.1-Donor-Beta.apk | tee release/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-V1.1-Donor-Beta
          path: release/JARVIS-Android-V1.1-Donor-Beta.apk
          if-no-files-found: error
          retention-days: 30
