name: JARVIS Brain Core

on:
  push:
    branches: [brain-first-v1]
    paths:
      - 'brain-core/**'
      - '.github/workflows/brain-core.yml'
  pull_request:
    paths:
      - 'brain-core/**'
      - '.github/workflows/brain-core.yml'

permissions:
  contents: read

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run standalone brain acceptance suite
        working-directory: brain-core
        run: ./run-tests.sh
