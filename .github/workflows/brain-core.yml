name: JARVIS Brain Core

on:
  push:
    branches: [brain-first-v1]
    paths:
      - 'brain-core/**'
      - '.github/workflows/brain-core.yml'
  pull_request:
    paths:
      - 'brain-core/**'
      - '.github/workflows/brain-core.yml'
      - 'android/app/src/main/java/com/jarvis/mobile/assistant/JarvisVoiceSession.java'

permissions:
  contents: write

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply delivery-day TTS listener ERROR fix once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/voice-back-half-tts-listener-error-20260902'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/com/jarvis/mobile/assistant/JarvisVoiceSession.java')
          source = path.read_text()
          start = "            engine.setOnUtteranceProgressListener(new UtteranceProgressListener() {"
          replacement_start = "            int listenerResult = engine.setOnUtteranceProgressListener(new UtteranceProgressListener() {"
          end = "            });\n        } catch (RuntimeException listenerFailure) {"
          replacement_end = '''            });
            if (listenerResult == TextToSpeech.ERROR) {
                Log.w(VOICE_RECOGNIZER_TAG, "TTS progress-listener attachment returned ERROR; retiring speech engine");
                invalidateSpeechCallback();
                releaseTextToSpeechSafely();
            }
        } catch (RuntimeException listenerFailure) {'''
          if replacement_start not in source:
              if source.count(start) != 1:
                  raise SystemExit(f'expected exactly one listener start, found {source.count(start)}; refusing broad edit')
              if source.count(end) != 1:
                  raise SystemExit(f'expected exactly one listener end, found {source.count(end)}; refusing broad edit')
              source = source.replace(start, replacement_start, 1)
              source = source.replace(end, replacement_end, 1)
              path.write_text(source)
          PY
          if ! git diff --quiet; then
            git config user.name "JARVIS Delivery Automation"
            git config user.email "actions@users.noreply.github.com"
            git add android/app/src/main/java/com/jarvis/mobile/assistant/JarvisVoiceSession.java
            git commit -m "fix(android): handle TTS listener ERROR return"
            git push origin HEAD:fix/voice-back-half-tts-listener-error-20260902
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run standalone brain acceptance suite
        working-directory: brain-core
        run: ./run-tests.sh
