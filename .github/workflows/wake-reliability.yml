name: Wake Reliability

on:
  push:
    branches:
      - feature/wake-end-speech-recovery
  workflow_dispatch:

jobs:
  end-of-speech-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OEM end-of-speech recovery contract
        run: bash .github/scripts/wake-end-speech-recovery-contract.sh
      - name: Verify wake service start-exception recovery contract
        run: bash .github/scripts/wake-service-start-exception-contract.sh
      - name: Run shared Brain Core regression
        run: bash brain-core/run-tests.sh
