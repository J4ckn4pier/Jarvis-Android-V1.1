name: Settings Permission Runtime Truth

on:
  pull_request:
    branches: [feature/product-local-cortex]
    paths:
      - 'android/app/src/main/java/com/jarvis/mobile/SettingsActivity.java'
      - '.github/scripts/settings-permission-runtime-contract.sh'
      - '.github/workflows/settings-permission-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify App Permissions summary reflects Android runtime access
        run: sh .github/scripts/settings-permission-runtime-contract.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Settings production surface
        working-directory: android
        run: gradle --rerun-tasks :app:compileDebugJavaWithJavac --stacktrace
